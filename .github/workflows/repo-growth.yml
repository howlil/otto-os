name: Update repository growth

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repo-growth.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-growth
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keep generated metrics off protected main; the action commits to this branch.
      - uses: actions/checkout@v7
        with:
          ref: repo-growth-data
      - uses: MacRimi/repo-growth@v1
        with:
          title: Otto OS growth
          metrics: stars,forks,downloads
