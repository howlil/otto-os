name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.3.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows Installer & Release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release metadata and check version parity
        id: meta
        shell: pwsh
        run: |
          $tag = if ('${{ github.event.inputs.tag }}') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          $version = $tag.TrimStart('v')
          $numericVersion = ($version -replace '-.*$', '')
          $cargoToml = Get-Content -LiteralPath 'Cargo.toml' -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw 'Could not read workspace version from Cargo.toml'
          }
          $cargoVersion = $Matches[1]
          if ($cargoVersion -ne $version) {
            throw "Version mismatch: tag '$tag' expects Cargo.toml version '$version', found '$cargoVersion'"
          }
          $manifest = Get-Content -LiteralPath 'crates\app\otto-os.manifest' -Raw
          if ($manifest -notmatch 'version="([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)"') {
            throw 'Could not read assembly version from crates\app\otto-os.manifest'
          }
          $expectedManifestVersion = "$numericVersion.0"
          if ($Matches[1] -ne $expectedManifestVersion) {
            throw "Manifest version mismatch: expected '$expectedManifestVersion', found '$($Matches[1])'"
          }
          $toolchainToml = Get-Content -LiteralPath 'rust-toolchain.toml' -Raw
          if ($toolchainToml -notmatch '(?m)^channel\s*=\s*"([^"]+)"') {
            throw 'Could not read channel from rust-toolchain.toml'
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "numeric_version=$numericVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "rust_channel=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.meta.outputs.rust_channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test core, render, and app crates
        run: cargo test -p otto-core -p otto-render -p otto-os -- --test-threads=1

      - name: Test headless platform units
        run: cargo test -p otto-platform -- --skip the_screen_grabber_returns_a_frame_of_the_requested_size --test-threads=1

      - name: Static E2E and visual manifest check
        shell: pwsh
        run: .\scripts\check-e2e.ps1

      - name: Build release binary
        run: cargo build --release -p otto-os

      - name: Decode code-signing certificate (if configured)
        id: cert
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if ($env:CERT_B64) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'signing-cert.pfx'
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:CERT_B64))
            "pfx_path=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Sign release executable (if certificate present)
        if: steps.cert.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $kitsBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signTool = Get-ChildItem -Path $kitsBin -Filter 'signtool.exe' -Recurse |
            Where-Object { $_.FullName -like '*\x64\*' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          & $signTool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f '${{ steps.cert.outputs.pfx_path }}' /p $env:CERT_PASSWORD 'target\release\otto-os.exe'

      - name: Install Inno Setup 6
        run: choco install innosetup -y

      - name: Build per-user Windows installer
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $args = @{
            Version = '${{ steps.meta.outputs.version }}'
            ExecutablePath = 'target\release\otto-os.exe'
            OutputDir = 'artifacts\release'
            SkipBuild = $true
          }
          if ('${{ steps.cert.outputs.enabled }}' -eq 'true') {
            $args['CertificatePath'] = '${{ steps.cert.outputs.pfx_path }}'
            $args['CertificatePassword'] = ConvertTo-SecureString -String $env:CERT_PASSWORD -AsPlainText -Force
          }
          .\packaging\installer\build.ps1 @args

      - name: Stage portable zip, WinGet manifests, and checksums
        shell: pwsh
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          $version = '${{ steps.meta.outputs.version }}'
          $numericVersion = '${{ steps.meta.outputs.numeric_version }}'
          $outDir = (Resolve-Path 'artifacts\release').Path

          $portableDir = Join-Path $env:RUNNER_TEMP 'otto-os-portable'
          $null = New-Item -ItemType Directory -Path $portableDir -Force
          Copy-Item -LiteralPath 'target\release\otto-os.exe' -Destination (Join-Path $portableDir 'otto-os.exe')
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $portableDir 'LICENSE')
          Copy-Item -LiteralPath 'README.md' -Destination (Join-Path $portableDir 'README.md')
          $zipPath = Join-Path $outDir "otto-os-$version-windows-x64.zip"
          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath $zipPath -Force

          $installerPath = Join-Path $outDir "otto-os-setup-$numericVersion-x64.exe"
          $installerHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToUpperInvariant()
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/otto-os-setup-$numericVersion-x64.exe"

          $wingetDir = Join-Path $outDir 'winget'
          $null = New-Item -ItemType Directory -Path $wingetDir -Force
          foreach ($manifest in Get-ChildItem -Path 'packaging\winget' -Filter '*.yaml') {
            $content = Get-Content -LiteralPath $manifest.FullName -Raw
            $content = $content -replace '(?m)^PackageVersion:\s*.*$', "PackageVersion: $numericVersion"
            $content = $content -replace '(?m)^(\s*InstallerUrl:\s*).*$', "`${1}$installerUrl"
            $content = $content -replace '(?m)^(\s*InstallerSha256:\s*).*$', "`${1}$installerHash"
            Set-Content -LiteralPath (Join-Path $wingetDir $manifest.Name) -Value $content -NoNewline
          }

          $checksumLines = Get-ChildItem -Path $outDir -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          }
          Set-Content -LiteralPath (Join-Path $outDir 'SHA256SUMS.txt') -Value ($checksumLines -join "`n")

          $changelog = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
          $escaped = [regex]::Escape($version)
          $sectionMatch = [regex]::Match(
            $changelog,
            "(?ms)^## \[$escaped\][^\r\n]*\r?\n(.*?)(?=^## \[|^\[[^\]]+\]:|\z)"
          )
          if (-not $sectionMatch.Success -or [string]::IsNullOrWhiteSpace($sectionMatch.Groups[1].Value)) {
            throw "CHANGELOG.md is missing a non-empty section for [$version]"
          }
          $notesBody = $sectionMatch.Groups[1].Value.Trim()
          Set-Content -LiteralPath (Join-Path $outDir 'RELEASE_NOTES.md') -Value $notesBody

      - name: Clean up temporary certificate
        if: always() && steps.cert.outputs.enabled == 'true'
        shell: pwsh
        run: Remove-Item -LiteralPath '${{ steps.cert.outputs.pfx_path }}' -Force -ErrorAction SilentlyContinue

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Otto OS ${{ steps.meta.outputs.tag }}
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') || startsWith(steps.meta.outputs.tag, 'v0.') }}
          body_path: artifacts/release/RELEASE_NOTES.md
          files: |
            artifacts/release/*.exe
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
            artifacts/release/winget/*.yaml
