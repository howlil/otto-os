name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust Gate (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Rust toolchain channel
        id: toolchain
        shell: pwsh
        run: |
          $toml = Get-Content -LiteralPath 'rust-toolchain.toml' -Raw
          if ($toml -notmatch '(?m)^channel\s*=\s*"([^"]+)"') {
            throw 'Could not read channel from rust-toolchain.toml'
          }
          "channel=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test core, render, and app crates
        run: cargo test -p otto-core -p otto-render -p otto-os -- --test-threads=1

      - name: Test headless platform units
        run: cargo test -p otto-platform -- --skip the_screen_grabber_returns_a_frame_of_the_requested_size --test-threads=1

      - name: Static E2E and visual manifest check
        shell: pwsh
        run: .\scripts\check-e2e.ps1

  landing:
    name: Landing Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck landing site
        run: bun x tsc --noEmit

      - name: Run landing tests
        run: bun test

      - name: Build landing site
        run: bun run build
