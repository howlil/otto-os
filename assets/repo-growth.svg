.pt{fill:#2965ed;stroke:#fff;stroke-width:2}.mark{stroke:#a9b9de;stroke-dasharray:4 5;stroke-width:1.5}
@media(prefers-color-scheme:dark){.bg{fill:#0d1117}.border,.divider,.grid{stroke:#30363d}.heading,.panel,.value{fill:#e6edf3}.eyebrow,.meta,.tick{fill:#8b949e}.barbg{fill:#222c3d}.bar{fill:#4884ff}.trend{stroke:#72a1ff}.pt{fill:#72a1ff;stroke:#0d1117}.mark{stroke:#48597b}.metric{fill:#72a1ff}}
]]></style>
