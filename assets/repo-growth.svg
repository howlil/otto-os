<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Otto OS project growth — awaiting first data collection</title>
  <desc id="desc">The GitHub Action has not yet generated the first metrics snapshot. After the first successful run, this placeholder is replaced with a graph of stars, forks, and release downloads.</desc>
  <style>
    text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .heading{font-weight:650;font-size:22px;fill:#6b7280}
    .muted{font-size:15px;fill:#858b98}
    .label{font-size:14px;fill:#737b89;font-weight:600}
    .line{stroke:#a2a9b4;stroke-width:1;opacity:.35}
    .dash{stroke:#a2a9b4;stroke-width:2;stroke-dasharray:5 8;opacity:.55}
    @media (prefers-color-scheme:dark){.heading,.label{fill:#c9d1d9}.muted{fill:#9ca3af}.line,.dash{stroke:#8b949e}}
  </style>
  <text class="heading" x="28" y="40">Otto OS — Project Growth</text>
  <text class="muted" x="28" y="67">Waiting for the first GitHub Actions metrics collection</text>
  <g transform="translate(28 96)">
    <g>
      <text class="label" x="0" y="0">STARS</text>
      <path class="line" d="M0 148V23H252"/>
      <path class="dash" d="M20 124L55 102 105 111 148 77 202 69 240 42"/>
    </g>
    <g transform="translate(294 0)">
      <text class="label" x="0" y="0">FORKS</text>
      <path class="line" d="M0 148V23H252"/>
      <path class="dash" d="M20 129L66 129 110 95 153 95 204 72 240 72"/>
    </g>
    <g transform="translate(588 0)">
      <text class="label" x="0" y="0">DOWNLOADS</text>
      <path class="line" d="M0 148V23H252"/>
      <path class="dash" d="M20 135L54 116 98 121 143 83 192 62 240 32"/>
    </g>
  </g>
  <text class="muted" x="28" y="274">Illustrative placeholders — no historical data yet. Run “Update repository growth” once in Actions.</text>
</svg>
