[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/render", "crates/app"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/howlil/otto-os"
publish = false

[workspace.dependencies]
windows = "0.62"
windows-core = "0.62"
otto-core = { path = "crates/core" }
otto-platform = { path = "crates/platform" }
otto-render = { path = "crates/render" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
borrow_as_ptr = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
