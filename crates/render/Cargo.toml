[package]
name = "otto-render"
description = "Direct2D and DirectWrite rendering of the notch bar onto a per-pixel-alpha layered window."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
windows-numerics = "0.100"
otto-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Threading"] }

[lints]
workspace = true
